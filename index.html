<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var THEME_KEY = 'portfolio-theme'
        var LOCALE_KEY = 'portfolio-locale'
        var h = new Date().getHours()
        var themeStored = null
        var localeStored = null
        try {
          themeStored = localStorage.getItem(THEME_KEY)
          localeStored = localStorage.getItem(LOCALE_KEY)
        } catch (e) {}
        var theme =
          themeStored === 'day' || themeStored === 'night'
            ? themeStored
            : h >= 6 && h < 18
              ? 'day'
              : 'night'
        var locale =
          localeStored === 'eng' ||
          localeStored === 'kor' ||
          localeStored === 'vie'
            ? localeStored
            : 'eng'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.lang =
          locale === 'kor' ? 'ko' : locale === 'vie' ? 'vi' : 'en'
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio — CV cá nhân" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rokka — Portfolio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
